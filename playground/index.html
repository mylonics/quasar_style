<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quasar + PrimeVue Aura playground</title>
    <link href="vendor/quasar.prod.css" rel="stylesheet" />
    <link href="vendor/material-icons/material-icons.css" rel="stylesheet" />
    <link href="primevue-aura.css" rel="stylesheet" id="aura-theme" />
    <!-- The Aura theme is toggled at runtime by the nav bar below, and also
         injected by the screenshot tooling for before/after captures. -->
    <style>
      body { padding: 24px; padding-top: 64px; }
      .gallery { max-width: 980px; margin: 0 auto; }
      .row-wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .demo-block { margin-bottom: 28px; }
      h2.section { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .6; margin: 0 0 10px; }
      #dev-nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        display: flex; align-items: center; gap: 6px; padding: 6px 14px;
        background: #1e293b; color: #f8fafc; font-family: sans-serif; font-size: 13px;
        box-shadow: 0 2px 6px rgba(0,0,0,.3);
      }
      #dev-nav a {
        color: #94a3b8; text-decoration: none; padding: 4px 10px;
        border-radius: 4px; transition: background .15s;
      }
      #dev-nav a:hover { background: #334155; color: #f8fafc; }
      #dev-nav a.active { background: #3b82f6; color: #fff; }
      .nav-group { display: flex; align-items: center; gap: 3px; border: 1px solid #334155; border-radius: 6px; padding: 2px; }
      .nav-group-label { color: #64748b; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 0 6px; white-space: nowrap; }
      .nav-sep { width: 1px; height: 20px; background: #334155; margin: 0 4px; }
      #dev-nav button {
        margin-left: auto; padding: 4px 12px; border: 1px solid #475569;
        background: transparent; color: #f8fafc; border-radius: 4px;
        cursor: pointer; font-size: 13px; transition: background .15s;
      }
      #dev-nav button:hover { background: #334155; }
      #dev-nav button.on { background: #3b82f6; border-color: #3b82f6; }
    </style>
  </head>
  <body>
    <nav id="dev-nav">
      <div class="nav-group">
        <span class="nav-group-label">Components</span>
        <a href="index.html" id="nav-plain" class="active">Quasar</a>
        <a href="primevue.html">PrimeVue</a>
        <a href="components.html">New</a>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-group">
        <span class="nav-group-label">Dashboards</span>
        <a href="dashboard.html">Quasar</a>
        <a href="dashboard.primevue.html">PrimeVue</a>
        <a href="dashboard-split.html">Side by Side</a>
      </div>
      <button id="theme-toggle">Enable Aura theme</button>
    </nav>
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        var auraEnabled = true;
        btn.textContent = 'Disable Aura theme';
        btn.classList.add('on');
        document.getElementById('nav-plain').textContent = 'Quasar + Aura';
        btn.addEventListener('click', function () {
          auraEnabled = !auraEnabled;
          if (auraEnabled) {
            var existing = document.getElementById('aura-theme');
            if (!existing) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = 'primevue-aura.css';
              link.id = 'aura-theme';
              document.head.appendChild(link);
            }
            btn.textContent = 'Disable Aura theme';
            btn.classList.add('on');
            document.getElementById('nav-plain').textContent = 'Quasar + Aura';
          } else {
            var el = document.getElementById('aura-theme');
            if (el) el.parentNode.removeChild(el);
            btn.textContent = 'Enable Aura theme';
            btn.classList.remove('on');
            document.getElementById('nav-plain').textContent = 'Plain Quasar';
          }
        });
      })();
    </script>
    <div id="q-app"></div>

    <script src="vendor/vue.global.prod.js"></script>
    <script src="vendor/quasar.umd.prod.js"></script>
    <script src="vendor/aura-components.js"></script>
    <script>
      const { createApp } = Vue;
      const app = createApp({
        data() {
          return {
            text: 'Initial value',
            text2: '',
            sel: 'Quasar',
            options: ['Quasar', 'PrimeVue', 'Vue', 'Vite'],
            check: true,
            check2: false,
            radio: 'a',
            toggle: true,
            slider: 40,
            progress: 0.6,
            tab: 'one',
            // New components (Phase 3/4)
            meter: [
              { label: 'Apps', value: 16, color: '#6366f1' },
              { label: 'Messages', value: 8, color: '#22c55e' },
              { label: 'Media', value: 24, color: '#f59e0b' },
              { label: 'System', value: 10, color: '#ef4444' },
            ],
            collapsed: false,
            inplaceActive: false,
            inplaceText: 'Click to edit this text',
            products: Array.from({ length: 9 }, (_, i) => ({
              id: i + 1,
              name: 'Product ' + (i + 1),
              price: (i + 1) * 12,
            })),
            layout: 'list',
            order: ['San Francisco', 'London', 'Paris', 'Istanbul', 'Tokyo'],
            orderSel: [],
            pick: [['Audio', 'Video', 'Books', 'Games'], ['Movies']],
            pickSel: [[], []],
          };
        },
        template: `
          <div class="gallery">
            <div class="demo-block" data-shot="buttons">
              <h2 class="section">Buttons</h2>
              <div class="row-wrap">
                <q-btn color="primary" label="Primary" />
                <q-btn color="secondary" label="Secondary" />
                <q-btn color="positive" label="Success" />
                <q-btn color="negative" label="Danger" />
                <q-btn outline color="primary" label="Outlined" />
                <q-btn flat color="primary" label="Text" />
                <q-btn color="primary" rounded label="Rounded" />
                <q-btn color="primary" icon="add" round />
              </div>
            </div>

            <div class="demo-block" data-shot="fields">
              <h2 class="section">Inputs &amp; Select</h2>
              <div class="row-wrap">
                <q-input outlined v-model="text" style="width:220px" />
                <q-input outlined v-model="text2" placeholder="Placeholder" style="width:220px" />
                <q-select outlined v-model="sel" :options="options" style="width:220px" />
              </div>
            </div>

            <div class="demo-block" data-shot="selection">
              <h2 class="section">Checkbox / Radio / Toggle</h2>
              <div class="row-wrap">
                <q-checkbox v-model="check" label="Checked" />
                <q-checkbox v-model="check2" label="Unchecked" />
                <q-radio v-model="radio" val="a" label="Option A" />
                <q-radio v-model="radio" val="b" label="Option B" />
                <q-toggle v-model="toggle" label="Toggle" />
              </div>
            </div>

            <div class="demo-block" data-shot="chips">
              <h2 class="section">Chips &amp; Badges</h2>
              <div class="row-wrap">
                <q-chip>Default</q-chip>
                <q-chip>Primary</q-chip>
                <q-chip removable>Removable</q-chip>
                <q-badge color="primary" label="Badge" />
                <q-badge color="negative" label="9+" rounded />
              </div>
            </div>

            <div class="demo-block" data-shot="progress">
              <h2 class="section">Progress &amp; Slider</h2>
              <div class="row-wrap" style="flex-direction:column; align-items:stretch">
                <q-linear-progress :value="progress" color="primary" style="height:8px" class="q-mb-md" />
                <q-slider v-model="slider" :min="0" :max="100" color="primary" />
              </div>
            </div>

            <div class="demo-block" data-shot="tabs">
              <h2 class="section">Tabs</h2>
              <q-tabs v-model="tab" align="left" active-color="primary" indicator-color="primary">
                <q-tab name="one" label="Overview" />
                <q-tab name="two" label="Details" />
                <q-tab name="three" label="Settings" />
              </q-tabs>
            </div>

            <div class="demo-block" data-shot="card">
              <h2 class="section">Card</h2>
              <q-card style="max-width:320px">
                <q-card-section>
                  <div class="text-h6">Card title</div>
                  <div class="text-subtitle2 text-grey">Supporting subtitle</div>
                  <div class="q-mt-sm">
                    Cards group related content and actions in an Aura surface.
                  </div>
                </q-card-section>
                <q-card-actions align="right">
                  <q-btn flat color="primary" label="Cancel" />
                  <q-btn color="primary" label="Save" />
                </q-card-actions>
              </q-card>
            </div>

            <div class="demo-block" data-shot="list">
              <h2 class="section">List</h2>
              <q-card style="max-width:320px">
                <q-list>
                  <q-item clickable>
                    <q-item-section>Inbox</q-item-section>
                  </q-item>
                  <q-item clickable active>
                    <q-item-section>Starred</q-item-section>
                  </q-item>
                  <q-item clickable>
                    <q-item-section>Sent</q-item-section>
                  </q-item>
                </q-list>
              </q-card>
            </div>

            <div class="demo-block" data-shot="banner">
              <h2 class="section">Banner</h2>
              <q-banner>
                This is an informational banner styled as an Aura surface.
              </q-banner>
            </div>

            <div class="demo-block" data-shot="metergroup">
              <h2 class="section">MeterGroup</h2>
              <MeterGroup :value="meter" :max="100" />
            </div>

            <div class="demo-block" data-shot="fieldset">
              <h2 class="section">Fieldset</h2>
              <Fieldset legend="Personal information" toggleable v-model:collapsed="collapsed">
                <p>Toggle the legend to collapse this content.</p>
                <q-input outlined label="Name" style="max-width:280px" />
              </Fieldset>
            </div>

            <div class="demo-block" data-shot="inplace">
              <h2 class="section">Inplace</h2>
              <Inplace v-model:active="inplaceActive" closable>
                <template #display>{{ inplaceText }}</template>
                <template #content>
                  <q-input outlined dense v-model="inplaceText" autofocus style="width:280px" />
                </template>
              </Inplace>
            </div>

            <div class="demo-block" data-shot="dataview">
              <h2 class="section">DataView</h2>
              <DataView :value="products" :layout="layout" :rows="4" paginator>
                <template #header>
                  <div class="row items-center justify-between">
                    <span>Products</span>
                    <q-btn-toggle v-model="layout" dense unelevated :options="[
                      { value: 'list', icon: 'view_list' },
                      { value: 'grid', icon: 'grid_view' },
                    ]" />
                  </div>
                </template>
                <template #list="{ items }">
                  <q-list separator>
                    <q-item v-for="p in items" :key="p.id">
                      <q-item-section>{{ p.name }}</q-item-section>
                      <q-item-section side>\${{ p.price }}</q-item-section>
                    </q-item>
                  </q-list>
                </template>
                <template #grid="{ items }">
                  <q-card v-for="p in items" :key="p.id" flat bordered class="q-pa-md">
                    <div class="text-subtitle1">{{ p.name }}</div>
                    <div class="text-primary text-weight-bold">\${{ p.price }}</div>
                  </q-card>
                </template>
              </DataView>
            </div>

            <div class="demo-block" data-shot="orderlist">
              <h2 class="section">OrderList</h2>
              <OrderList v-model="order" v-model:selection="orderSel">
                <template #header>Cities</template>
                <template #item="{ item }">{{ item }}</template>
              </OrderList>
            </div>

            <div class="demo-block" data-shot="picklist">
              <h2 class="section">PickList</h2>
              <PickList v-model="pick" v-model:selection="pickSel">
                <template #sourceheader>Available</template>
                <template #targetheader>Selected</template>
                <template #item="{ item }">{{ item }}</template>
              </PickList>
            </div>
          </div>
        `,
      });
      app.use(Quasar, { config: {} });
      app.use(QuasarAuraComponents.default || QuasarAuraComponents);
      app.mount('#q-app');
    </script>
  </body>
</html>
