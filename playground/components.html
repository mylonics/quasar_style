<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quasar Aura — new components</title>
    <link href="vendor/quasar.prod.css" rel="stylesheet" />
    <link href="vendor/material-icons/material-icons.css" rel="stylesheet" />
    <link href="primevue-aura.css" rel="stylesheet" id="aura-theme" />
    <style>
      body { padding: 24px; padding-top: 64px; }
      .gallery { max-width: 980px; margin: 0 auto; }
      .demo-block { margin-bottom: 36px; }
      h2.section { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .6; margin: 0 0 10px; }
      .demo-card { border: 1px solid var(--p-content-border-color, #e2e8f0); border-radius: 8px; padding: 12px; }
      #dev-nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        display: flex; align-items: center; gap: 8px; padding: 8px 16px;
        background: #1e293b; color: #f8fafc; font-family: sans-serif; font-size: 13px;
        box-shadow: 0 2px 6px rgba(0,0,0,.3);
      }
      #dev-nav a {
        color: #94a3b8; text-decoration: none; padding: 4px 10px;
        border-radius: 4px; transition: background .15s;
      }
      #dev-nav a:hover { background: #334155; color: #f8fafc; }
      #dev-nav a.active { background: #3b82f6; color: #fff; }
    </style>
  </head>
  <body>
    <nav id="dev-nav">
      <a href="index.html">Quasar + Aura</a>
      <a href="primevue.html">PrimeVue Reference</a>
      <a href="components.html" class="active">New components</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
    <div id="q-app"></div>

    <script src="vendor/vue.global.prod.js"></script>
    <script src="vendor/quasar.umd.prod.js"></script>
    <script src="vendor/aura-components.js"></script>
    <script>
      const { createApp } = Vue;
      const app = createApp({
        data() {
          return {
            // Password
            password: '',
            // BlockUI
            blockUIBlocked: false,
            // AutoComplete
            acValue: null,
            acSuggestions: [],
            acItems: ['Angular', 'React', 'Svelte', 'TypeScript', 'Vue'],
            // ConfirmPopup
            confirmResult: '',
            // Image
            // (no extra state needed)
            // Popover
            popRef: null,
            // MeterGroup
            meter: [
              { label: 'Apps', value: 16, color: '#6366f1' },
              { label: 'Messages', value: 8, color: '#22c55e' },
              { label: 'Media', value: 24, color: '#f59e0b' },
              { label: 'System', value: 10, color: '#ef4444' },
            ],
            // Fieldset
            collapsed: false,
            // Inplace
            inplaceActive: false,
            inplaceText: 'Click to edit this text',
            // DataView
            products: Array.from({ length: 9 }, (_, i) => ({
              id: i + 1,
              name: 'Product ' + (i + 1),
              price: (i + 1) * 12,
            })),
            layout: 'list',
            // OrderList
            order: ['San Francisco', 'London', 'Paris', 'Istanbul', 'Tokyo'],
            orderSel: [],
            // PickList
            pick: [['Audio', 'Video', 'Books', 'Games'], ['Movies']],
            pickSel: [[], []],
            // DeferredContent
            deferredLoaded: false,
            // FocusTrap
            focusTrapActive: true,
            // Form wrappers
            iconFieldValue: '',
            maskedDate: '',
            otpValue: '',
            cascadeValue: null,
            cascadeOptions: [
              {
                label: 'Europe',
                items: [
                  { label: 'France', value: 'fr' },
                  { label: 'Germany', value: 'de' },
                ],
              },
              {
                label: 'Americas',
                items: [
                  { label: 'Canada', value: 'ca' },
                  { label: 'Brazil', value: 'br' },
                ],
              },
            ],
            treeSelectValue: null,
            treeOptions: [
              {
                key: 'documents',
                label: 'Documents',
                children: [
                  { key: 'work', label: 'Work' },
                  { key: 'home', label: 'Home' },
                ],
              },
            ],
            // Dialogs
            confirmDialogResult: '',
            dynamicDialogComponent: {
              props: ['message'],
              template: '<div style="padding:12px">{{ message }}</div>',
            },
            dynamicDialogClosed: false,
            // Menus
            tieredMenuItems: [
              { label: 'File', items: [{ label: 'New' }, { label: 'Open' }] },
              { separator: true },
              { label: 'Edit', items: [{ label: 'Copy' }, { label: 'Paste' }] },
            ],
            panelMenuExpanded: { reports: true },
            panelMenuItems: [
              { key: 'reports', label: 'Reports', items: [{ label: 'Sales' }, { label: 'Customers' }] },
              { key: 'settings', label: 'Settings', items: [{ label: 'Profile' }] },
            ],
            megaMenuItems: [
              {
                label: 'Products',
                items: [[
                  { label: 'Suite', items: [{ label: 'CRM' }, { label: 'Analytics' }] },
                  { label: 'Services', items: [{ label: 'Support' }, { label: 'Training' }] },
                ]],
              },
            ],
            dockItems: [
              { label: 'Home', icon: 'home' },
              { label: 'Search', icon: 'search' },
              { label: 'Settings', icon: 'settings' },
            ],
            // Media
            galleriaIndex: 0,
            galleriaVisible: false,
            galleryItems: [
              {
                src: 'https://primefaces.org/cdn/primevue/images/galleria/galleria1.jpg',
                thumbnailImageSrc: 'https://primefaces.org/cdn/primevue/images/galleria/galleria1s.jpg',
                title: 'Mountain lake',
              },
              {
                src: 'https://primefaces.org/cdn/primevue/images/galleria/galleria2.jpg',
                thumbnailImageSrc: 'https://primefaces.org/cdn/primevue/images/galleria/galleria2s.jpg',
                title: 'Forest path',
              },
              {
                src: 'https://primefaces.org/cdn/primevue/images/galleria/galleria3.jpg',
                thumbnailImageSrc: 'https://primefaces.org/cdn/primevue/images/galleria/galleria3s.jpg',
                title: 'City lights',
              },
            ],
            // Data
            treeTableExpanded: { '0': true },
            treeTableSelection: {},
            treeTableColumns: [
              { field: 'name', header: 'Name', expander: true },
              { field: 'size', header: 'Size' },
            ],
            treeTableValue: [
              {
                key: '0',
                data: { name: 'Documents', size: '25kb' },
                children: [{ key: '0-0', data: { name: 'Resume.pdf', size: '10kb' } }],
              },
            ],
            orgSelection: {},
            orgValue: {
              key: 'ceo',
              label: 'CEO',
              children: [
                { key: 'cto', label: 'CTO' },
                { key: 'cfo', label: 'CFO' },
              ],
            },
            // Terminal
            terminalLastCommand: '',
          };
        },
        methods: {
          openConfirmDialog() {
            this.$refs.confirmDialog.show();
          },
          openDynamicDialog() {
            this.dynamicDialogClosed = false;
            this.$refs.dynamicDialog.show({
              component: this.dynamicDialogComponent,
              props: { message: 'Dynamic dialog body' },
              onClose: () => {
                this.dynamicDialogClosed = true;
              },
            });
          },
          onTerminalCommand(event) {
            this.terminalLastCommand = event.value;
            this.$refs.demoTerminal.addResponse('Echo: ' + event.value);
          },
        },
        template: `
          <div class="gallery">
            <div class="demo-block">
              <h2 class="section">AutoComplete</h2>
              <div class="demo-card">
                <AutoComplete
                  v-model="acValue"
                  :suggestions="acSuggestions"
                  placeholder="Search frameworks…"
                  @complete="acSuggestions = acItems.filter(i => i.toLowerCase().includes($event.query.toLowerCase()))"
                  style="width:280px"
                />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">ConfirmPopup</h2>
              <div class="demo-card">
                <q-btn label="Delete item" color="negative">
                  <ConfirmPopup
                    message="Are you sure you want to delete this item?"
                    @accept="confirmResult = 'Accepted'"
                    @reject="confirmResult = 'Rejected'"
                  />
                </q-btn>
                <span v-if="confirmResult" class="q-ml-sm">Result: {{ confirmResult }}</span>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">Image (with preview)</h2>
              <div class="demo-card">
                <Image
                  src="https://primefaces.org/cdn/primevue/images/galleria/galleria1.jpg"
                  alt="Gallery photo"
                  width="200"
                  preview
                />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">Password</h2>
              <div class="demo-card">
                <Password v-model="password" toggle-mask feedback placeholder="Enter password" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">BlockUI</h2>
              <div class="demo-card" style="position:relative">
                <BlockUI :blocked="blockUIBlocked">
                  <q-card flat>
                    <q-card-section>
                      <div class="text-subtitle1">Blocked content area</div>
                      <p>Click the button below to toggle the BlockUI overlay.</p>
                    </q-card-section>
                  </q-card>
                </BlockUI>
                <q-btn class="q-mt-sm" :label="blockUIBlocked ? 'Unblock' : 'Block'" @click="blockUIBlocked = !blockUIBlocked" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">Popover</h2>
              <div class="demo-card">
                <q-btn label="Toggle Popover">
                  <Popover ref="popRef">
                    <div style="padding:12px; max-width:200px">
                      <div class="text-subtitle2">Popover content</div>
                      <p style="margin:8px 0 0">This is a PrimeVue-style popover anchored to the button.</p>
                    </div>
                  </Popover>
                </q-btn>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">MeterGroup</h2>
              <div class="demo-card">
                <MeterGroup :value="meter" :max="100" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">Fieldset (toggleable)</h2>
              <Fieldset legend="Personal information" toggleable v-model:collapsed="collapsed">
                <p>Toggle the legend to collapse this content. Built on QSlideTransition.</p>
                <q-input outlined label="Name" style="max-width:280px" />
              </Fieldset>
            </div>

            <div class="demo-block">
              <h2 class="section">Inplace</h2>
              <div class="demo-card">
                <Inplace v-model:active="inplaceActive" closable>
                  <template #display>{{ inplaceText }}</template>
                  <template #content>
                    <q-input outlined dense v-model="inplaceText" autofocus style="width:280px" />
                  </template>
                </Inplace>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">DataView</h2>
              <DataView :value="products" :layout="layout" :rows="4" paginator>
                <template #header>
                  <div class="row items-center justify-between">
                    <span>Products</span>
                    <q-btn-toggle v-model="layout" dense unelevated :options="[
                      { value: 'list', icon: 'view_list' },
                      { value: 'grid', icon: 'grid_view' },
                    ]" />
                  </div>
                </template>
                <template #list="{ items }">
                  <q-list separator>
                    <q-item v-for="p in items" :key="p.id">
                      <q-item-section>{{ p.name }}</q-item-section>
                      <q-item-section side>\${{ p.price }}</q-item-section>
                    </q-item>
                  </q-list>
                </template>
                <template #grid="{ items }">
                  <q-card v-for="p in items" :key="p.id" flat bordered class="q-pa-md">
                    <div class="text-subtitle1">{{ p.name }}</div>
                    <div class="text-primary text-weight-bold">\${{ p.price }}</div>
                  </q-card>
                </template>
              </DataView>
            </div>

            <div class="demo-block">
              <h2 class="section">OrderList</h2>
              <OrderList v-model="order" v-model:selection="orderSel">
                <template #header>Cities</template>
                <template #item="{ item }">{{ item }}</template>
              </OrderList>
            </div>

            <div class="demo-block">
              <h2 class="section">PickList</h2>
              <PickList v-model="pick" v-model:selection="pickSel">
                <template #sourceheader>Available</template>
                <template #targetheader>Selected</template>
                <template #item="{ item }">{{ item }}</template>
              </PickList>
            </div>


            <div class="demo-block">
              <h2 class="section">DeferredContent</h2>
              <div class="demo-card">
                <DeferredContent @load="deferredLoaded = true">
                  <q-banner dense class="bg-primary text-white">Deferred content loaded into view.</q-banner>
                </DeferredContent>
                <div class="q-mt-sm">Loaded: {{ deferredLoaded }}</div>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">FocusTrap</h2>
              <div class="demo-card">
                <FocusTrap v-model:active="focusTrapActive">
                  <q-btn label="First" flat color="primary" />
                  <q-btn label="Second" flat color="primary" class="q-ml-sm" />
                </FocusTrap>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">IconField + InputIcon</h2>
              <div class="demo-card">
                <IconField>
                  <InputIcon><span class="material-icons">search</span></InputIcon>
                  <q-input outlined v-model="iconFieldValue" label="Search" style="max-width:280px" />
                </IconField>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">IftaLabel</h2>
              <div class="demo-card">
                <IftaLabel>
                  <label>Email</label>
                  <q-input outlined value="team@example.com" />
                </IftaLabel>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">InputMask</h2>
              <div class="demo-card">
                <InputMask v-model="maskedDate" mask="99/99/9999" placeholder="MM/DD/YYYY" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">InputOtp</h2>
              <div class="demo-card">
                <InputOtp v-model="otpValue" :length="6" integer-only />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">CascadeSelect</h2>
              <div class="demo-card">
                <CascadeSelect v-model="cascadeValue" :options="cascadeOptions" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">TreeSelect</h2>
              <div class="demo-card">
                <TreeSelect v-model="treeSelectValue" :options="treeOptions" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">ConfirmDialog</h2>
              <div class="demo-card">
                <q-btn label="Open confirm dialog" color="primary" @click="openConfirmDialog" />
                <ConfirmDialog ref="confirmDialog" @accept="confirmDialogResult = 'Accepted'" @reject="confirmDialogResult = 'Rejected'" />
                <div class="q-mt-sm">{{ confirmDialogResult }}</div>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">DynamicDialog</h2>
              <div class="demo-card">
                <q-btn label="Open dynamic dialog" color="secondary" @click="openDynamicDialog" />
                <DynamicDialog ref="dynamicDialog" @close="dynamicDialogClosed = true" />
                <div class="q-mt-sm">Closed: {{ dynamicDialogClosed }}</div>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">TieredMenu</h2>
              <div class="demo-card">
                <TieredMenu :model="tieredMenuItems" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">PanelMenu</h2>
              <div class="demo-card">
                <PanelMenu :model="panelMenuItems" v-model:expandedKeys="panelMenuExpanded" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">MegaMenu</h2>
              <div class="demo-card">
                <MegaMenu :model="megaMenuItems" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">Dock</h2>
              <div class="demo-card" style="min-height:120px; position:relative">
                <Dock :model="dockItems" position="bottom" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">Galleria</h2>
              <div class="demo-card">
                <Galleria
                  :value="galleryItems"
                  v-model:activeIndex="galleriaIndex"
                  v-model:visible="galleriaVisible"
                  :show-item-navigators="true"
                  :full-screen="true"
                />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">ImageCompare</h2>
              <div class="demo-card">
                <ImageCompare>
                  <img src="https://primefaces.org/cdn/primevue/images/galleria/galleria4.jpg" alt="Before" />
                  <img src="https://primefaces.org/cdn/primevue/images/galleria/galleria5.jpg" alt="After" />
                </ImageCompare>
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">TreeTable</h2>
              <div class="demo-card">
                <TreeTable
                  :value="treeTableValue"
                  :columns="treeTableColumns"
                  v-model:expandedKeys="treeTableExpanded"
                  v-model:selectionKeys="treeTableSelection"
                  selection-mode="single"
                />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">OrgChart</h2>
              <div class="demo-card">
                <OrgChart :value="orgValue" v-model:selectionKeys="orgSelection" selection-mode="single" />
              </div>
            </div>

            <div class="demo-block">
              <h2 class="section">Terminal</h2>
              <div class="demo-card">
                <Terminal ref="demoTerminal" welcome-message="Welcome to the Quasar Aura terminal" @command="onTerminalCommand" />
                <div class="q-mt-sm">Last command: {{ terminalLastCommand }}</div>
              </div>
            </div>
          </div>
        `,
      });
      app.use(Quasar, { config: {} });
      app.use(QuasarAuraComponents.default || QuasarAuraComponents);
      app.mount('#q-app');
    </script>
  </body>
</html>
