<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Side by Side (Quasar vs PrimeVue)</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* Dev nav — same palette as other pages */
      #dev-nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        display: flex; align-items: center; gap: 4px; padding: 6px 14px;
        background: #1e293b; color: #f8fafc; font-family: sans-serif; font-size: 13px;
        box-shadow: 0 2px 6px rgba(0,0,0,.3);
      }
      #dev-nav a {
        color: #94a3b8; text-decoration: none; padding: 4px 10px;
        border-radius: 4px; transition: background .15s;
      }
      #dev-nav a:hover { background: #334155; color: #f8fafc; }
      #dev-nav a.active { background: #3b82f6; color: #fff; }
      .nav-group {
        display: flex; align-items: center; gap: 3px;
        border: 1px solid #334155; border-radius: 6px; padding: 2px;
      }
      .nav-group-label {
        color: #64748b; font-size: 11px; font-weight: 600;
        letter-spacing: .05em; text-transform: uppercase;
        padding: 0 6px; white-space: nowrap;
      }
      .nav-sep { width: 1px; height: 20px; background: #334155; margin: 0 4px; }
      #dev-nav .spacer { margin-left: auto; }
      #dev-nav label { color: #cbd5e1; }
      #dev-nav select {
        background: #0f172a; color: #f8fafc; border: 1px solid #475569;
        border-radius: 4px; padding: 3px 6px; font-size: 13px;
      }
      #dev-nav button {
        background: #1e293b; color: #94a3b8; border: 1px solid #334155;
        border-radius: 4px; padding: 4px 10px; font-size: 13px; cursor: pointer;
      }
      #dev-nav button.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }

      /* Split layout */
      .split-wrap {
        display: flex;
        height: 100vh;
        padding-top: 40px; /* room for nav */
      }
      .split-pane {
        flex: 1;
        position: relative;
        min-width: 0;
        overflow: auto;
      }
      .split-pane + .split-pane {
        border-left: 2px solid #334155;
      }
      .split-label {
        position: absolute; top: 0; left: 0; right: 0; z-index: 10;
        background: #0f172a; color: #f8fafc;
        font-size: 11px; font-weight: 700; letter-spacing: .08em;
        text-transform: uppercase; text-align: center;
        padding: 3px 0; pointer-events: none;
      }
      .split-pane iframe {
        width: 100%;
        height: calc(100% - 20px);
        margin-top: 20px;
        border: none;
      }
    </style>
  </head>
  <body>
    <nav id="dev-nav">
      <div class="nav-group">
        <span class="nav-group-label">Components</span>
        <a href="index.html">Quasar</a>
        <a href="primevue.html">PrimeVue</a>
        <a href="components.html">New</a>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-group">
        <span class="nav-group-label">Dashboards</span>
        <a href="dashboard.html">Quasar</a>
        <a href="dashboard.primevue.html">PrimeVue</a>
        <a href="dashboard-split.html" class="active">Side by Side</a>
      </div>
      <span class="spacer"></span>
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="aura">Aura</option>
        <option value="material">Material</option>
        <option value="lara">Lara</option>
        <option value="nora">Nora</option>
      </select>
      <label for="palette-select">Primary</label>
      <select id="palette-select"></select>
      <button id="aura-toggle">Disable theme</button>
    </nav>

    <div class="split-wrap">
      <div class="split-pane" id="pane-quasar">
        <div class="split-label">⚡ Quasar + Aura theme</div>
        <iframe id="iframe-quasar" src="dashboard.html?embedded=1" title="Quasar dashboard"></iframe>
      </div>
      <div class="split-pane" id="pane-primevue">
        <div class="split-label">🎯 PrimeVue Aura (reference)</div>
        <iframe id="iframe-primevue" src="dashboard.primevue.html?embedded=1" title="PrimeVue dashboard"></iframe>
      </div>
    </div>

    <script>
      // Palette definitions — mirrors dashboard-data.js PALETTES (kept in sync).
      const PALETTES = {
        noir:    { 50:'#fafafa',100:'#f5f5f5',200:'#e5e5e5',300:'#d4d4d4',400:'#a3a3a3',500:'#737373',600:'#525252',700:'#404040',800:'#262626',900:'#171717',950:'#0a0a0a' },
        emerald: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b',950:'#022c22' },
        green:   { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d',950:'#052e16' },
        blue:    { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a',950:'#172554' },
        indigo:  { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
        violet:  { 50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',800:'#5b21b6',900:'#4c1d95',950:'#2e1065' },
        purple:  { 50:'#faf5ff',100:'#f3e8ff',200:'#e9d5ff',300:'#d8b4fe',400:'#c084fc',500:'#a855f7',600:'#9333ea',700:'#7e22ce',800:'#6b21a8',900:'#581c87',950:'#3b0764' },
        fuchsia: { 50:'#fdf4ff',100:'#fae8ff',200:'#f5d0fe',300:'#f0abfc',400:'#e879f9',500:'#d946ef',600:'#c026d3',700:'#a21caf',800:'#86198f',900:'#701a75',950:'#4a044e' },
        pink:    { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843',950:'#500724' },
        rose:    { 50:'#fff1f2',100:'#ffe4e6',200:'#fecdd3',300:'#fda4af',400:'#fb7185',500:'#f43f5e',600:'#e11d48',700:'#be123c',800:'#9f1239',900:'#881337',950:'#4c0519' },
        red:     { 50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d',950:'#450a0a' },
        orange:  { 50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12',950:'#431407' },
        amber:   { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f',950:'#451a03' },
        yellow:  { 50:'#fefce8',100:'#fef9c3',200:'#fef08a',300:'#fde047',400:'#facc15',500:'#eab308',600:'#ca8a04',700:'#a16207',800:'#854d0e',900:'#713f12',950:'#422006' },
        lime:    { 50:'#f7fee7',100:'#ecfccb',200:'#d9f99d',300:'#bef264',400:'#a3e635',500:'#84cc16',600:'#65a30d',700:'#4d7c0f',800:'#3f6212',900:'#365314',950:'#1a2e05' },
        teal:    { 50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a',950:'#042f2e' },
        cyan:    { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63',950:'#083344' },
        sky:     { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e',950:'#082f49' },
        slate:   { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617' },
      };
      const DEFAULT_PALETTE = 'noir';

      const select = document.getElementById('palette-select');
      Object.keys(PALETTES).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name.charAt(0).toUpperCase() + name.slice(1);
        select.appendChild(opt);
      });
      select.value = DEFAULT_PALETTE;

      // Propagate palette change to both iframes.
      // Quasar page: call DASHBOARD.applyPrimaryPalette (sets CSS vars).
      // PrimeVue page: call DASHBOARD.applyPrimaryPalette + PrimeVue.updatePrimaryPalette.
      function propagatePalette(name) {
        const palette = PALETTES[name];
        [document.getElementById('iframe-quasar'), document.getElementById('iframe-primevue')].forEach(iframe => {
          try {
            const win = iframe.contentWindow;
            if (!win) return;
            if (win.DASHBOARD && win.DASHBOARD.applyPrimaryPalette) {
              win.DASHBOARD.applyPrimaryPalette(name);
            }
            if (win.PrimeVue && win.PrimeVue.updatePrimaryPalette) {
              win.PrimeVue.updatePrimaryPalette(palette);
            }
            // Rebuild chart if the app exposes it
            if (win.__dashApp && win.__dashApp.rebuildChart) {
              win.__dashApp.rebuildChart();
            }
          } catch (e) {
            // cross-origin: ignore
          }
        });
      }

      select.addEventListener('change', () => propagatePalette(select.value));

      // Theme (preset) switching, propagated to both iframes:
      //  - Quasar iframe: point #aura-theme at the chosen primevue-<preset>.css
      //  - PrimeVue iframe: usePreset() the matching preset, then re-apply palette
      const THEME_CSS = {
        aura: 'primevue-aura.css',
        material: 'primevue-material.css',
        lara: 'primevue-lara.css',
        nora: 'primevue-nora.css',
      };
      const THEME_PRESET = { aura: 'Aura', material: 'Material', lara: 'Lara', nora: 'Nora' };
      const themeSelect = document.getElementById('theme-select');
      let currentTheme = 'aura';
      themeSelect.value = currentTheme;

      function presetFromWin(win, capName) {
        const t = win.PrimeUIX && win.PrimeUIX.Themes && win.PrimeUIX.Themes[capName];
        return t && (t.default || t);
      }

      function propagateTheme(name) {
        currentTheme = name;
        // Quasar iframe
        try {
          const qWin = document.getElementById('iframe-quasar').contentWindow;
          const el = qWin && qWin.document.getElementById('aura-theme');
          if (el) el.href = THEME_CSS[name];
          if (qWin && qWin.__dashApp && qWin.__dashApp.rebuildChart) qWin.__dashApp.rebuildChart();
        } catch (e) {}
        // PrimeVue iframe
        try {
          const pWin = document.getElementById('iframe-primevue').contentWindow;
          if (pWin && pWin.PrimeVue && pWin.PrimeVue.usePreset) {
            const preset = presetFromWin(pWin, THEME_PRESET[name]);
            if (preset) pWin.PrimeVue.usePreset(preset);
          }
        } catch (e) {}
        // Re-apply palette so it survives the preset swap.
        propagatePalette(select.value);
      }

      themeSelect.addEventListener('change', () => propagateTheme(themeSelect.value));

      // Theme toggle — enable/disable the active preset stylesheet in the Quasar iframe.
      let auraEnabled = true;
      const auraBtn = document.getElementById('aura-toggle');
      auraBtn.addEventListener('click', function () {
        try {
          const qWin = document.getElementById('iframe-quasar').contentWindow;
          if (auraEnabled) {
            const el = qWin.document.getElementById('aura-theme');
            if (el) el.parentNode.removeChild(el);
            auraBtn.textContent = 'Enable theme';
            auraBtn.classList.remove('on');
          } else {
            if (!qWin.document.getElementById('aura-theme')) {
              const link = qWin.document.createElement('link');
              link.rel = 'stylesheet';
              link.href = THEME_CSS[currentTheme];
              link.id = 'aura-theme';
              qWin.document.head.appendChild(link);
            }
            auraBtn.textContent = 'Disable theme';
            auraBtn.classList.add('on');
          }
          auraEnabled = !auraEnabled;
          // Rebuild chart after theme change
          try {
            const qApp = qWin.__dashApp;
            if (qApp && qApp.rebuildChart) qApp.rebuildChart();
          } catch (e) {}
        } catch (e) {}
      });
      auraBtn.classList.add('on');

      // After iframes load: hide nav, fix height, and propagate initial palette.
      function setupIframe(iframe) {
        iframe.addEventListener('load', () => {
          try {
            const style = iframe.contentDocument.createElement('style');
            style.textContent = [
              '#dev-nav { display: none !important; }',
              'body { padding: 16px !important; }',
              '.dash-shell { height: calc(100vh - 32px) !important; }',
            ].join(' ');
            iframe.contentDocument.head.appendChild(style);
          } catch (e) {}
          // Propagate current palette selection into the freshly loaded iframe
          propagatePalette(select.value);
          // Propagate current theme (preset) into the freshly loaded iframe
          propagateTheme(currentTheme);
        });
      }

      setupIframe(document.getElementById('iframe-quasar'));
      setupIframe(document.getElementById('iframe-primevue'));
    </script>
  </body>
</html>
